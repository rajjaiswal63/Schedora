spring.application.name=schedora-backend

spring.datasource.url=jdbc:h2:mem:schedora;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

schedora.jwt.secret=${SCHEDORA_JWT_SECRET:dev-only-schedora-jwt-secret-key-please-change-before-production-2026}
schedora.jwt.expiration-ms=${SCHEDORA_JWT_EXPIRATION_MS:86400000}
schedora.cors.allowed-origins=${SCHEDORA_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
schedora.seed.enabled=${SCHEDORA_SEED_ENABLED:true}
